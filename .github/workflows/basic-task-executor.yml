# Callable Workflow: Basic Task Executor
name: Basic Task Executor

on:
  workflow_call:
    inputs:
      task_id:
        required: true
        type: string
        description: "Unique ID for the task being executed"
      task_description:
        required: false
        type: string
        description: "Brief description of the task"
      context_data:
        required: false
        type: string
        description: "JSON string or other data providing context for the task"
    outputs:
      result:
        description: "Output or result of the task execution"
        value: ${{ jobs.execute_task.outputs.task_result }}
      artifact_name:
        description: "Name of the artifact created (if any)"
        value: ${{ jobs.execute_task.outputs.artifact_name }}

jobs:
  execute_task:
    runs-on: ubuntu-latest
    outputs:
      task_result: ${{ steps.run_task.outputs.result }}
      artifact_name: ${{ steps.run_task.outputs.artifact_name }}
    steps:
      - name: Checkout code (optional, if needed)
        uses: actions/checkout@v4

      - name: Display Task Inputs
        id: display_inputs
        run: |
          echo "[$(date +%Y-%m-%dT%H:%M:%SZ)] INFO: Received Task ID: ${{ inputs.task_id }}"
          echo "[$(date +%Y-%m-%dT%H:%M:%SZ)] INFO: Task Description: ${{ inputs.task_description }}"
          echo "[$(date +%Y-%m-%dT%H:%M:%SZ)] INFO: Context Data: ${{ inputs.context_data }}"

      # Example Task: Create a file based on task_id
      - name: Run Task (Create File)
        id: run_task
        run: |
          echo "[$(date +%Y-%m-%dT%H:%M:%SZ)] INFO: Executing task: Create file based on task_id"
          file_name="task_${{ inputs.task_id }}_output.txt"
          echo "This file was generated for task ${{ inputs.task_id }}." > $file_name
          echo "Context provided: ${{ inputs.context_data }}" >> $file_name
          echo "[$(date +%Y-%m-%dT%H:%M:%SZ)] SUCCESS: File $file_name created successfully."
          # Set outputs
          result_value="File $file_name created."
          echo "result=$result_value" >> "$GITHUB_OUTPUT"
          echo "artifact_name=$file_name" >> "$GITHUB_OUTPUT"

      # Optional: Upload the created file as an artifact
      - name: Upload Task Artifact
        uses: actions/upload-artifact@v4
        with:
          name: task-output-${{ inputs.task_id }}
          path: task_${{ inputs.task_id }}_output.txt

      - name: Report Result
        run: echo "[$(date +%Y-%m-%dT%H:%M:%SZ)] INFO: Task Result: ${{ steps.run_task.outputs.result }}"

