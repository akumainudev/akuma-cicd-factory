---
name: Forge Executor

on:
  workflow_call:
    inputs:
      # Adjusted inputs based on task-trigger.yml
      task_id:
        required: true
        type: string
      task_description:
        required: false
        type: string
      context_data:
        required: false
        type: string

jobs:
  run-task:
    runs-on: ubuntu-latest
    steps:
      - name: Debug Inputs
        run: |
          echo "Task ID: ${{ inputs.task_id }}"
          echo "Task Description: ${{ inputs.task_description }}"
          echo "Context Data: ${{ inputs.context_data }}"
