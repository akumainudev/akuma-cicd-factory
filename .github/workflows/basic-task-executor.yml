# Workflow: Basic Task Executor (with Git-based file creation)
name: Forge Executor

on:
  workflow_call:
    inputs:
      task_id:
        required: true
        type: string
      task_description:
        required: false
        type: string
      context_data:
        required: true # Context data is required for actions
        type: string
    # Define secrets required by this reusable workflow
    secrets:
      ACTIONS_PAT:
        required: true # PAT is required for git operations

jobs:
  run-task:
    runs-on: ubuntu-latest
    steps:
      - name: Debug Inputs
        run: |
          echo "Task ID: ${{ inputs.task_id }}"
          echo "Task Description: ${{ inputs.task_description }}"
          # Removed echo for context_data to avoid bash errors with JSON string
          echo "Context Data: (See job setup logs for full value)"

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Parse Context Data
        id: parse
        env:
          CONTEXT_JSON: ${{ inputs.context_data }}
        run: |
          echo "Parsing context data..."
          # Use fromJSON to handle the escaped JSON string from the trigger workflow
          echo "action=$(echo 
'$CONTEXT_JSON' | jq -r .action)" >> $GITHUB_OUTPUT
          echo "repo=$(echo 
'$CONTEXT_JSON' | jq -r .repo)" >> $GITHUB_OUTPUT
          echo "branch=$(echo 
'$CONTEXT_JSON' | jq -r .branch)" >> $GITHUB_OUTPUT
          echo "path=$(echo 
'$CONTEXT_JSON' | jq -r .path)" >> $GITHUB_OUTPUT
          echo "content=$(echo 
'$CONTEXT_JSON' | jq -r .content)" >> $GITHUB_OUTPUT
          echo "message=$(echo 
'$CONTEXT_JSON' | jq -r .message)" >> $GITHUB_OUTPUT
          echo "Parsing complete."

      - name: Checkout Target Repository
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.parse.outputs.repo }}
          ref: ${{ steps.parse.outputs.branch }}
          token: ${{ secrets.ACTIONS_PAT }} # Use PAT for checkout
          path: target_repo # Checkout to a specific subdirectory

      - name: "DEBUG: Show Parsed Variables"
        run: |
          echo "Action: ${{ steps.parse.outputs.action }}"
          echo "Repo: ${{ steps.parse.outputs.repo }}"
          echo "Branch: ${{ steps.parse.outputs.branch }}"
          echo "File Path: ${{ steps.parse.outputs.path }}"
          echo "Commit Message: ${{ steps.parse.outputs.message }}"
          # Avoid echoing potentially large content directly
          echo "Content length: $(echo "${{ steps.parse.outputs.content }}" | wc -c)"

      - name: Execute Action - create_file
        if: steps.parse.outputs.action == 'create_file'
        working-directory: ./target_repo # Change to the checked-out repo directory
        run: |
          echo "Creating/Updating file: ${{ steps.parse.outputs.path }}"
          # Ensure directory exists if path includes subdirectories
          mkdir -p "$(dirname "${{ steps.parse.outputs.path }}")"
          echo "${{ steps.parse.outputs.content }}" > "${{ steps.parse.outputs.path }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${{ steps.parse.outputs.path }}"

          # Debugging steps before commit/push
          echo "--- DEBUG: Git Status Before Commit ---"
          git status
          echo "--- DEBUG: File Content --- "
          cat "${{ steps.parse.outputs.path }}"
          echo "--- END DEBUG --- "

          # Commit changes
          git commit -m "${{ steps.parse.outputs.message }}" || echo "No changes to commit"

          # Push changes using PAT with enhanced error checking
          repo_url="https://x-access-token:${{ secrets.ACTIONS_PAT }}@github.com/${{ steps.parse.outputs.repo }}.git"
          echo "Pushing to branch: ${{ steps.parse.outputs.branch }}"
          
          # Attempt push and capture exit code
          git push "$repo_url" HEAD:${{ steps.parse.outputs.branch }}
          push_exit_code=$?
          
          # Check exit code and provide detailed error message if failed
          if [ $push_exit_code -ne 0 ]; then
            echo "::error::Git push failed with exit code $push_exit_code."
            echo "Potential causes:"
            echo "1. PAT Permissions: Ensure the ACTIONS_PAT has 'contents: write' permission for the target repository ('${{ steps.parse.outputs.repo }}')."
            echo "2. Branch Protection: Check if branch protection rules on '${{ steps.parse.outputs.branch }}' prevent direct pushes."
            echo "3. Repository URL: Verify the repository URL is correct: $repo_url"
            echo "4. PAT Validity: Ensure the ACTIONS_PAT is still valid and not expired/revoked."
            exit $push_exit_code # Exit with the push error code
          else
            echo "Git push successful."
          fi

      # This step is now less necessary due to the inline error check, but kept for redundancy
      - name: "DEBUG: Check logs for push error (Redundant)"
        if: failure() && steps.parse.outputs.action == 'create_file'
        run: echo "Git push likely failed. Check permissions, PAT validity, or repo URL."

